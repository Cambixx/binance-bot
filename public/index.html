<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de señales · binance-bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── Paleta: instancia de referencia de la guía de dataviz, validada con su script ──────────
   Categórica (3 slots) y estado (good/critical) verificados en ambos modos contra estas
   superficies: CVD ΔE 9.2 light / 9.4 dark, normal-vision 24.0 / 20.9. El aqua queda por
   debajo de 3:1 en claro → la regla de relieve obliga a etiquetas directas y vista de tabla,
   que es lo que hace este panel. */
:root {
  color-scheme: light;
  --page:      #f9f9f7;
  --surface:   #fcfcfb;
  --surface-2: #f2f2ee;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --muted:     #898781;
  --grid:      #e1e0d9;
  --axis:      #c3c2b7;
  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --good-bg: #e8f5e8; --critical-bg: #fbeaea; --warning-bg: #fdf4e0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --surface-2: #232322;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --s1: #3987e5;  --s2: #d95926;  --s3: #199e70;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --good-bg: #10240f; --critical-bg: #2a1212; --warning-bg: #2b220c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:      #0d0d0d;
  --surface:   #1a1a19;
  --surface-2: #232322;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --muted:     #898781;
  --grid:      #2c2c2a;
  --axis:      #383835;
  --s1: #3987e5;  --s2: #d95926;  --s3: #199e70;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --good-bg: #10240f; --critical-bg: #2a1212; --warning-bg: #2b220c;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }
.mono, code { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.num { font-variant-numeric: tabular-nums; }
h1,h2,h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0 0 .9em; }
a { color: var(--s1); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 3px; }

.eyebrow {
  font-family: "IBM Plex Mono", monospace; font-size: .66rem; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

/* ── topbar ── */
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--page);
  border-bottom: 1px solid var(--grid); margin-bottom: 26px;
}
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.top-in h1 { margin-right: auto; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs button {
  font: inherit; font-size: .84rem; font-weight: 500; cursor: pointer;
  background: none; border: 1px solid transparent; color: var(--ink-2);
  padding: 5px 11px; border-radius: 5px;
}
nav.tabs button:hover { background: var(--surface-2); }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--page); }
.ghost-btn {
  font: inherit; font-size: .8rem; cursor: pointer; background: var(--surface);
  border: 1px solid var(--axis); color: var(--ink-2); padding: 5px 10px; border-radius: 5px;
}
.ghost-btn:hover { border-color: var(--ink-2); }

/* ── bloques ── */
section[hidden] { display: none; }
.panel {
  background: var(--surface); border: 1px solid var(--grid); border-radius: 8px;
  padding: 18px 20px; margin-bottom: 18px;
}
.panel > h2, .panel > h3 { margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: .84rem; margin-bottom: 16px; }
.grid { display: grid; gap: 16px; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }

/* ── stat tiles ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--grid); border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; }
.tile .l { display: block; font-family: "IBM Plex Mono", monospace; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.tile .v { display: block; font-size: 1.5rem; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .s { display: block; font-size: .74rem; color: var(--muted); margin-top: 4px; }
.v.pos { color: var(--good); } .v.neg { color: var(--critical); } .v.warn { color: var(--warning); }

/* ── chips (estado = color + icono + texto, nunca color solo) ── */
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-family: "IBM Plex Mono", monospace; font-size: .66rem; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; border: 1px solid;
}
.chip.ok   { color: var(--good);     background: var(--good-bg);     border-color: var(--good); }
.chip.bad  { color: var(--critical); background: var(--critical-bg); border-color: var(--critical); }
.chip.warn { color: var(--warning);  background: var(--warning-bg);  border-color: var(--warning); }
.chip.flat { color: var(--ink-2);    background: var(--surface-2);   border-color: var(--axis); }

/* ── tablas ── */
.tw { overflow-x: auto; border: 1px solid var(--grid); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
thead th {
  font-family: "IBM Plex Mono", monospace; font-size: .62rem; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  background: var(--surface-2); position: sticky; top: 0;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
.pos { color: var(--good); } .neg { color: var(--critical); }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }

/* ── charts ── */
figure { margin: 0; }
figcaption { font-size: .8rem; color: var(--muted); margin-top: 8px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .78rem; color: var(--ink-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .08s;
  background: var(--surface); border: 1px solid var(--axis); border-radius: 6px;
  padding: 7px 10px; font-size: .76rem; box-shadow: 0 4px 16px -6px rgba(0,0,0,.35);
  z-index: 5; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.tip.on { opacity: 1; }
.tip .k { color: var(--muted); }
details.tbl { margin-top: 12px; }
details.tbl summary { cursor: pointer; font-size: .78rem; color: var(--ink-2); }

.note { background: var(--surface-2); border-left: 3px solid var(--axis); border-radius: 0 5px 5px 0; padding: 11px 14px; font-size: .84rem; color: var(--ink-2); margin: 14px 0; }
.note.warn { border-left-color: var(--warning); background: var(--warning-bg); }
.empty { color: var(--muted); font-size: .86rem; padding: 18px 0; text-align: center; }
footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--grid); font-size: .78rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 640px) { .wrap { padding: 0 13px 60px; } .panel { padding: 14px; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1>Panel de señales</h1>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <button class="ghost-btn" id="theme">Tema</button>
    <button class="ghost-btn" id="reload">Actualizar</button>
  </div>
</header>

<div class="wrap">
  <div id="status"></div>
  <main id="views"></main>
  <footer id="foot"></footer>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════════════════════════
   Panel de señales — binance-bot
   · Datos VIVOS  : /api/dashboard-data (lee los blobs en cada carga; sin regenerar nada a mano)
   · Datos de ANÁLISIS: data/analysis.json (destilado por build-dashboard-data.js)
   Sin dependencias externas: el proyecto es zero-dep y los gráficos son SVG a medida.
   ═══════════════════════════════════════════════════════════════════════════════════════════ */

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElementNS(attrs.__svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === '__svg' || v == null) continue;
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.appendChild(c);
  return n;
};
const svgEl = (tag, attrs = {}, kids = []) => el(tag, { ...attrs, __svg: true }, kids);

const nf = (v, d = 2) => (v == null || !Number.isFinite(+v)) ? '—' : (+v).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 2) => v == null || !Number.isFinite(+v) ? '—' : `${(+v) >= 0 ? '+' : ''}${nf(v, d)} %`;
const usd = (v, d = 2) => v == null || !Number.isFinite(+v) ? '—' : `${(+v) >= 0 ? '+' : ''}${nf(v, d)}`;
const sign = (v) => v == null || !Number.isFinite(+v) ? '' : (+v > 0 ? 'pos' : +v < 0 ? 'neg' : '');
const fecha = (t) => { const d = new Date(t); return Number.isFinite(d.getTime()) ? d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: '2-digit' }) : '—'; };
const fechaHora = (t) => { const d = new Date(t); return Number.isFinite(d.getTime()) ? d.toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; };
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ─────────────────────────────── Gráficos (SVG a medida) ─────────────────────────────── */

/** Ejes y rejilla recesivos, compartidos por todas las formas. */
function frame(w, h, pad) {
  const g = svgEl('g');
  return { g, x0: pad.l, x1: w - pad.r, y0: pad.t, y1: h - pad.b };
}
function gridLines(g, f, ticks, scaleY, fmt) {
  for (const t of ticks) {
    const y = scaleY(t);
    g.appendChild(svgEl('line', { x1: f.x0, x2: f.x1, y1: y, y2: y, stroke: css('--grid'), 'stroke-width': 1 }));
    g.appendChild(svgEl('text', { x: f.x0 - 8, y: y + 4, 'text-anchor': 'end', 'font-size': 11, fill: css('--muted'), 'font-family': 'IBM Plex Mono, monospace' , text: fmt(t) }));
  }
}
function niceTicks(min, max, n = 5) {
  if (!(max > min)) return [min];
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

/**
 * Serie temporal, 1-3 líneas. Crosshair + tooltip: un gráfico HTML es interactivo por defecto.
 * Etiqueta directa al final de cada serie (además de la leyenda), para no depender del color.
 */
function lineChart(host, series, opts = {}) {
  host.innerHTML = '';
  const W = Math.max(320, host.clientWidth || 640), H = opts.height || 240;
  const pad = { l: 56, r: 62, t: 12, b: 26 };
  const f = frame(W, H, pad);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'serie temporal' });

  const all = series.flatMap(s => s.v);
  const tAll = series.flatMap(s => s.t);
  if (!all.length) { host.appendChild(el('div', { class: 'empty', text: 'Sin datos' })); return; }
  const yMin = opts.yMin != null ? opts.yMin : Math.min(...all), yMax = Math.max(...all);
  const tMin = Math.min(...tAll), tMax = Math.max(...tAll);
  const sx = (t) => f.x0 + (tMax === tMin ? 0 : (t - tMin) / (tMax - tMin)) * (f.x1 - f.x0);
  const sy = (v) => f.y1 - (yMax === yMin ? 0.5 : (v - yMin) / (yMax - yMin)) * (f.y1 - f.y0);

  gridLines(f.g, f, niceTicks(yMin, yMax, 4), sy, opts.yFmt || ((v) => nf(v, 0)));
  f.g.appendChild(svgEl('line', { x1: f.x0, x2: f.x1, y1: f.y1, y2: f.y1, stroke: css('--axis'), 'stroke-width': 1 }));
  for (const t of [tMin, (tMin + tMax) / 2, tMax]) {
    f.g.appendChild(svgEl('text', { x: sx(t), y: H - 8, 'text-anchor': t === tMin ? 'start' : t === tMax ? 'end' : 'middle', 'font-size': 11, fill: css('--muted'), 'font-family': 'IBM Plex Mono, monospace', text: fecha(t) }));
  }

  series.forEach((s) => {
    const d = s.t.map((t, i) => `${i ? 'L' : 'M'}${sx(t).toFixed(1)},${sy(s.v[i]).toFixed(1)}`).join('');
    if (s.area) {
      f.g.appendChild(svgEl('path', { d: `${d}L${sx(s.t[s.t.length - 1]).toFixed(1)},${sy(yMin)}L${sx(s.t[0]).toFixed(1)},${sy(yMin)}Z`, fill: s.color, opacity: .13 }));
    }
    f.g.appendChild(svgEl('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    // Etiqueta directa: la identidad no puede depender solo del color.
    const lx = sx(s.t[s.t.length - 1]), ly = sy(s.v[s.v.length - 1]);
    f.g.appendChild(svgEl('text', { x: Math.min(lx + 7, W - 4), y: ly + 4, 'font-size': 11, 'font-weight': 600, fill: s.color, 'font-family': 'IBM Plex Mono, monospace', text: s.short || s.name }));
  });

  const cross = svgEl('line', { y1: f.y0, y2: f.y1, stroke: css('--axis'), 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 });
  const dots = series.map(s => svgEl('circle', { r: 4, fill: s.color, stroke: css('--surface'), 'stroke-width': 2, opacity: 0 }));
  f.g.appendChild(cross); dots.forEach(d => f.g.appendChild(d));
  svg.appendChild(f.g);
  host.appendChild(svg);

  const tip = el('div', { class: 'tip' });
  host.appendChild(tip);
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const x = (px / r.width) * W;
    if (x < f.x0 || x > f.x1) return hide();
    const t = tMin + ((x - f.x0) / (f.x1 - f.x0)) * (tMax - tMin);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1);
    let html = `<div class="k">${fecha(t)}</div>`;
    series.forEach((s, i) => {
      let k = 0; for (let j = 1; j < s.t.length; j++) if (Math.abs(s.t[j] - t) < Math.abs(s.t[k] - t)) k = j;
      dots[i].setAttribute('cx', sx(s.t[k])); dots[i].setAttribute('cy', sy(s.v[k])); dots[i].setAttribute('opacity', 1);
      html += `<div><span class="swatch" style="background:${s.color}"></span>${s.name}: <b>${(opts.tipFmt || ((v) => nf(v, 2)))(s.v[k])}</b></div>`;
    });
    tip.innerHTML = html; tip.classList.add('on');
    const tw = tip.offsetWidth;
    tip.style.left = `${Math.max(0, Math.min(r.width - tw, (x / W) * r.width - tw / 2))}px`;
    tip.style.top = `4px`;
  };
  const hide = () => { tip.classList.remove('on'); cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); };
  svg.addEventListener('mousemove', move); svg.addEventListener('mouseleave', hide);
  svg.addEventListener('touchmove', move, { passive: true }); svg.addEventListener('touchend', hide);
}

/** Barras horizontales divergentes por signo. Para folds, deltas y contrafactuales. */
function divergingBars(host, items, opts = {}) {
  host.innerHTML = '';
  const W = Math.max(320, host.clientWidth || 640);
  const rowH = opts.rowH || 26, pad = { l: opts.labelW || 150, r: 60, t: 8, b: 24 };
  const H = pad.t + pad.b + items.length * rowH;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.aria || 'barras' });
  const g = svgEl('g');
  const vals = items.map(i => i.value).filter(Number.isFinite);
  const m = Math.max(0.001, ...vals.map(Math.abs));
  const x0 = pad.l, x1 = W - pad.r, zero = x0 + (x1 - x0) / 2;
  const sx = (v) => zero + (v / m) * ((x1 - x0) / 2) * 0.94;

  items.forEach((it, i) => {
    const y = pad.t + i * rowH, cy = y + rowH / 2;
    g.appendChild(svgEl('text', { x: x0 - 10, y: cy + 4, 'text-anchor': 'end', 'font-size': 12, fill: css('--ink-2'), text: it.label }));
    if (!Number.isFinite(it.value)) return;
    const px = sx(it.value), left = Math.min(zero, px), w = Math.max(2, Math.abs(px - zero));
    const color = it.color || (it.value >= 0 ? css('--good') : css('--critical'));
    g.appendChild(svgEl('rect', { x: left, y: cy - 7, width: w, height: 14, rx: 4, fill: color, opacity: .92 }));
    g.appendChild(svgEl('text', {
      x: it.value >= 0 ? px + 7 : px - 7, y: cy + 4,
      'text-anchor': it.value >= 0 ? 'start' : 'end',
      'font-size': 11, 'font-family': 'IBM Plex Mono, monospace', fill: css('--ink-2'),
      text: (opts.fmt || ((v) => nf(v, 2)))(it.value),
    }));
  });
  g.appendChild(svgEl('line', { x1: zero, x2: zero, y1: pad.t, y2: H - pad.b, stroke: css('--axis'), 'stroke-width': 1 }));
  g.appendChild(svgEl('text', { x: zero, y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted'), 'font-family': 'IBM Plex Mono, monospace', text: opts.zeroLabel || '0' }));
  svg.appendChild(g); host.appendChild(svg);
}

/**
 * Forest plot: punto = mejora media, barra = IC 95 %. Es la forma correcta para el gate robusto,
 * porque lo que decide NO es el punto sino si el intervalo cruza el cero.
 */
function forestPlot(host, rows) {
  host.innerHTML = '';
  const W = Math.max(320, host.clientWidth || 640);
  const rowH = 30, pad = { l: 168, r: 84, t: 10, b: 28 };
  const H = pad.t + pad.b + rows.length * rowH;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'mejora media con intervalo de confianza' });
  const g = svgEl('g');
  const nums = rows.flatMap(r => [r.delta, r.ci?.[0], r.ci?.[1]]).filter(Number.isFinite);
  const m = Math.max(0.2, ...nums.map(Math.abs));
  const x0 = pad.l, x1 = W - pad.r, zero = x0 + (x1 - x0) / 2;
  const sx = (v) => zero + (v / m) * ((x1 - x0) / 2) * 0.92;

  g.appendChild(svgEl('rect', { x: x0, y: pad.t, width: x1 - x0, height: rows.length * rowH, fill: css('--surface-2'), opacity: .5, rx: 4 }));
  rows.forEach((r, i) => {
    const cy = pad.t + i * rowH + rowH / 2;
    g.appendChild(svgEl('text', { x: x0 - 10, y: cy + 4, 'text-anchor': 'end', 'font-size': 12, fill: css('--ink-2'), text: r.name }));
    if (!Number.isFinite(r.delta)) {
      g.appendChild(svgEl('text', { x: zero, y: cy + 4, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted'), text: 'baseline' }));
      return;
    }
    // El color codifica el VEREDICTO (adoptable / no), no el signo del punto.
    const passes = r.p != null && r.p >= 0.8;
    const color = passes ? css('--good') : css('--muted');
    if (Number.isFinite(r.ci?.[0]) && Number.isFinite(r.ci?.[1])) {
      g.appendChild(svgEl('line', { x1: sx(r.ci[0]), x2: sx(r.ci[1]), y1: cy, y2: cy, stroke: color, 'stroke-width': 2, opacity: .55 }));
      for (const b of r.ci) g.appendChild(svgEl('line', { x1: sx(b), x2: sx(b), y1: cy - 5, y2: cy + 5, stroke: color, 'stroke-width': 2, opacity: .55 }));
    }
    g.appendChild(svgEl('circle', { cx: sx(r.delta), cy, r: 5, fill: color, stroke: css('--surface'), 'stroke-width': 2 }));
    g.appendChild(svgEl('text', { x: x1 + 8, y: cy + 4, 'font-size': 11, 'font-family': 'IBM Plex Mono, monospace', fill: passes ? css('--good') : css('--muted'), text: r.p == null ? '—' : `P=${r.p.toFixed(2)}` }));
  });
  g.appendChild(svgEl('line', { x1: zero, x2: zero, y1: pad.t, y2: H - pad.b, stroke: css('--axis'), 'stroke-width': 1, 'stroke-dasharray': '4 3' }));
  g.appendChild(svgEl('text', { x: zero, y: H - 9, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted'), 'font-family': 'IBM Plex Mono, monospace', text: 'sin efecto' }));
  svg.appendChild(g); host.appendChild(svg);
}

/** Histograma de resultados por operación, coloreado por signo (el eje ya lo dice; el color refuerza). */
function histogram(host, values, opts = {}) {
  host.innerHTML = '';
  if (!values.length) { host.appendChild(el('div', { class: 'empty', text: 'Sin operaciones cerradas' })); return; }
  const W = Math.max(320, host.clientWidth || 640), H = opts.height || 200;
  const pad = { l: 46, r: 12, t: 10, b: 30 };
  const lo = Math.min(...values), hi = Math.max(...values);
  const nb = Math.min(24, Math.max(8, Math.ceil(Math.sqrt(values.length) * 1.6)));
  const step = (hi - lo) / nb || 1;
  const bins = Array.from({ length: nb }, (_, i) => ({ a: lo + i * step, b: lo + (i + 1) * step, n: 0 }));
  for (const v of values) bins[Math.min(nb - 1, Math.max(0, Math.floor((v - lo) / step)))].n++;
  const maxN = Math.max(...bins.map(b => b.n));
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'distribución del resultado por operación' });
  const g = svgEl('g');
  const x0 = pad.l, x1 = W - pad.r, y0 = pad.t, y1 = H - pad.b;
  const sx = (v) => x0 + ((v - lo) / (hi - lo || 1)) * (x1 - x0);
  const sy = (n) => y1 - (n / maxN) * (y1 - y0);
  gridLines(g, { x0, x1 }, niceTicks(0, maxN, 3), sy, (v) => nf(v, 0));
  const bw = (x1 - x0) / nb;
  bins.forEach((b) => {
    if (!b.n) return;
    const mid = (b.a + b.b) / 2;
    // 2px de hueco entre barras adyacentes, como pide la especificación de marcas.
    g.appendChild(svgEl('rect', { x: sx(b.a) + 1, y: sy(b.n), width: Math.max(1, bw - 2), height: y1 - sy(b.n), rx: 3, fill: mid >= 0 ? css('--good') : css('--critical'), opacity: .85 }));
  });
  if (lo < 0 && hi > 0) g.appendChild(svgEl('line', { x1: sx(0), x2: sx(0), y1: y0, y2: y1, stroke: css('--axis'), 'stroke-width': 1 }));
  g.appendChild(svgEl('line', { x1: x0, x2: x1, y1: y1, y2: y1, stroke: css('--axis'), 'stroke-width': 1 }));
  for (const v of [lo, 0, hi]) {
    if (v === 0 && !(lo < 0 && hi > 0)) continue;
    g.appendChild(svgEl('text', { x: sx(v), y: H - 9, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted'), 'font-family': 'IBM Plex Mono, monospace', text: `${nf(v, 0)}%` }));
  }
  svg.appendChild(g); host.appendChild(svg);
}

const tile = (label, value, sub, cls) => el('div', { class: 'tile' }, [
  el('span', { class: 'l', text: label }),
  el('span', { class: `v ${cls || ''}`, text: value }),
  sub ? el('span', { class: 's', text: sub }) : null,
]);

function table(cols, rows, opts = {}) {
  const thead = el('thead', {}, [el('tr', {}, cols.map(c => el('th', { class: c.r ? 'r' : '', text: c.t })))]);
  const tbody = el('tbody', {}, rows.map(r => el('tr', {}, r.map((cell, i) => {
    const td = el('td', { class: `${cols[i].r ? 'r' : ''} ${cell && cell.cls ? cell.cls : ''}`.trim() });
    if (cell && cell.html != null) td.innerHTML = cell.html;
    else td.textContent = cell && cell.t != null ? cell.t : (cell ?? '—');
    return td;
  }))));
  const wrap = el('div', { class: 'tw' }, [el('table', {}, [thead, tbody])]);
  if (!rows.length) return el('div', { class: 'empty', text: opts.empty || 'Sin datos' });
  return wrap;
}

/** Ficha del panel por libro. La win rate NUNCA va sola: al lado, su breakeven y el margen. */
function bookTable(books) {
  // Si el canal solo tiene un lado, "Global" y ese lado son la MISMA fila: se muestra una sola vez.
  const hasLong = !!books?.long?.trades, hasShort = !!books?.short?.trades;
  const order = (hasLong && hasShort)
    ? [['global', 'Global', '--s1'], ['long', 'Largo', '--s3'], ['short', 'Corto', '--s2']]
    : [['global', hasShort ? 'Corto' : 'Largo', hasShort ? '--s2' : '--s3']];
  const rows = order.filter(([k]) => books?.[k]?.trades).map(([k, name, c]) => {
    const b = books[k];
    return [
      { html: `<span class="swatch" style="background:${css(c)}"></span>${name}` },
      b.trades,
      { t: `${nf(b.winRate, 1)} %` },
      { t: b.breakevenWR == null ? '—' : `${nf(b.breakevenWR, 1)} %` },
      { t: b.marginPP == null ? '—' : `${(b.marginPP >= 0 ? '+' : '')}${nf(b.marginPP, 1)} pp`, cls: sign(b.marginPP) },
      { t: b.payoff == null ? '—' : `${nf(b.payoff, 2)}:1` },
      { t: b.profitFactor == null ? '∞' : nf(b.profitFactor, 2), cls: b.profitFactor != null && b.profitFactor < 1 ? 'neg' : '' },
      { t: usd(b.netProfit), cls: sign(b.netProfit) },
      { t: `${b.nEffective} / ${b.trades}` },
      { t: b.wilson95 ? `${nf(b.wilson95.low, 0)}–${nf(b.wilson95.high, 0)} %` : '—' },
    ];
  });
  return table([
    { t: 'Libro' }, { t: 'n', r: 1 }, { t: 'Win rate', r: 1 }, { t: 'Breakeven', r: 1 },
    { t: 'Margen', r: 1 }, { t: 'Payoff', r: 1 }, { t: 'PF', r: 1 }, { t: 'Neto', r: 1 },
    { t: 'N efectivo', r: 1 }, { t: 'Wilson 95 %', r: 1 },
  ], rows, { empty: 'Aún no hay señales cerradas' });
}

function backtestPanel(b) {
  const p = el('div', { class: 'panel' });
  p.appendChild(el('h2', { text: b.label }));
  p.appendChild(el('div', { class: 'sub', text: `${b.months} meses · ${b.symbols.length} símbolos · costes ${nf(b.costs?.roundTripPct, 2)} % round-trip · nocional fijo por señal` }));

  const g = b.full.books?.global || {};
  p.appendChild(el('div', { class: 'tiles', style: 'margin-bottom:18px' }, [
    tile('Señales', String(g.trades ?? b.full.totalTrades)),
    tile('Win rate', `${nf(g.winRate ?? b.full.winRate, 1)} %`, g.breakevenWR != null ? `breakeven ${nf(g.breakevenWR, 1)} %` : null),
    tile('Payoff', g.payoff == null ? '—' : `${nf(g.payoff, 2)}:1`, 'ganancia media ÷ pérdida media'),
    tile('Profit factor', nf(g.profitFactor ?? b.full.profitFactor, 2), null, (g.profitFactor ?? 0) >= 1 ? 'pos' : 'neg'),
    tile('Esperanza', usd(g.expectancy), 'por señal', sign(g.expectancy)),
  ]));

  // Referencia de mercado como CIFRA, no como serie: el bot despliega capital ilimitado y el
  // HODL 5.000 USDC, así que superponerlos en el mismo eje compararía cosas distintas.
  if (b.benchmark?.basket || b.benchmark?.btc) {
    p.appendChild(el('div', { class: 'note', html:
      `<b>Referencia del mismo periodo</b> (contexto, no comparación directa — el HODL despliega capital fijo y las señales no): ` +
      `cesta equiponderada <b class="${sign(b.benchmark?.basket?.roi)}">${pct(b.benchmark?.basket?.roi)}</b> · ` +
      `BTC <b class="${sign(b.benchmark?.btc?.roi)}">${pct(b.benchmark?.btc?.roi)}</b>.` }));
  }

  // P&L ACUMULADO de las señales cerradas, no la curva de equity.
  //
  // En modo señal la equity no es interpretable: con capital ilimitado y hasta 8 posiciones
  // simultáneas oscila ~8× el movimiento unitario, y superponerle un HODL que despliega 5.000
  // USDC compararía cosas con distinto capital desplegado. La suma acumulada del P&L realizado
  // sí describe lo que hace la señal: como todas tienen el MISMO nocional, es proporcional a la
  // suma de porcentajes, que es la forma estándar de evaluar un generador de señales.
  const cum = (() => {
    const ts = (b.trades || []).filter(t => Number.isFinite(t.o) && Number.isFinite(t.p)).sort((a, c) => a.o - c.o);
    const t = [], v = []; let acc = 0;
    for (const x of ts) { acc += x.p; t.push(x.o); v.push(Math.round(acc * 100) / 100); }
    return { t, v };
  })();
  if (cum.t.length > 1) {
    const fig = el('figure');
    fig.appendChild(el('h3', { text: 'P&L acumulado de las señales' }));
    const host = el('div', { class: 'chart', style: 'margin-top:8px' });
    fig.appendChild(host);
    fig.appendChild(el('figcaption', { html: `Suma del resultado de cada señal cerrada, en orden de cierre. Nocional fijo de ${nf(b.costs ? 1000 : 1000, 0)} USDC por señal, así que la curva es proporcional a la suma de porcentajes. <b>No es la equity de una cartera</b> y su caída no debe leerse como drawdown de cartera.` }));
    p.appendChild(fig);
    registerChart(() => lineChart(host, [
      { name: 'P&L acumulado', short: 'P&L', color: css('--s1'), t: cum.t, v: cum.v, area: true },
    ], { height: 240, yMin: Math.min(0, ...cum.v), yFmt: (v) => nf(v, 0), tipFmt: (v) => `${usd(v)} USDC` }));
  }

  const cols = el('div', { class: 'grid c2', style: 'margin-top:18px' });

  if (b.trades?.length) {
    const fig = el('figure');
    fig.appendChild(el('h3', { text: 'Distribución del resultado por señal' }));
    const host = el('div', { class: 'chart', style: 'margin-top:8px' });
    fig.appendChild(host);
    fig.appendChild(el('figcaption', { text: 'La forma del trend-following: muchas pérdidas pequeñas a la izquierda, pocas ganancias grandes en la cola derecha.' }));
    cols.appendChild(fig);
    registerChart(() => histogram(host, b.trades.map(t => t.pc).filter(Number.isFinite)));
  }

  if (b.truncation?.length) {
    const fig = el('figure');
    fig.appendChild(el('h3', { text: 'Qué pasa si cierras las ganadoras antes' }));
    const host = el('div', { class: 'chart', style: 'margin-top:8px' });
    fig.appendChild(host);
    const base = g.netProfit ?? b.full.expectancy * (g.trades || 1);
    fig.appendChild(el('figcaption', { html: `Contrafactual de take-profit sobre las señales reales. Base sin truncar: <b>${usd(base)} USDC</b>. Es el guardarraíl contra "subir el win rate".` }));
    cols.appendChild(fig);
    registerChart(() => divergingBars(host, b.truncation.map(t => ({ label: `TP al ${t.capPct} %`, value: t.netProfit })), { labelW: 110, fmt: (v) => nf(v, 0) }));
  }
  p.appendChild(cols);

  // Train vs holdout: la comparación que decide si hay edge o hay ajuste.
  const phases = [['full', 'Completo', b.full], ['train', 'Train', b.train], ['holdout', 'Holdout (OOS)', b.holdout]].filter(x => x[2]);
  p.appendChild(el('h3', { text: 'Dentro y fuera de muestra', style: 'margin:22px 0 8px' }));
  p.appendChild(table(
    [{ t: 'Fase' }, { t: 'Señales', r: 1 }, { t: 'Win rate', r: 1 }, { t: 'PF', r: 1 }, { t: 'Esperanza', r: 1 }, { t: 'Neto', r: 1 }],
    phases.map(([, name, m]) => {
      const bg = m.books?.global || {};
      return [name, bg.trades ?? m.totalTrades, `${nf(bg.winRate ?? m.winRate, 1)} %`,
        { t: nf(bg.profitFactor ?? m.profitFactor, 2), cls: (bg.profitFactor ?? m.profitFactor ?? 0) < 1 ? 'neg' : 'pos' },
        { t: usd(bg.expectancy), cls: sign(bg.expectancy) },
        { t: usd(bg.netProfit), cls: sign(bg.netProfit) }];
    })
  ));
  if (b.entryInWindow) {
    p.appendChild(el('div', { class: 'note', html: `<b>Holdout purgado.</b> Quitando las ${b.entryInWindow.inheritedFromPreviousWindow} posiciones que se abrieron en train y se cerraron en el holdout: <b>${b.entryInWindow.trades}</b> señales, PF <b>${nf(b.entryInWindow.profitFactor, 2)}</b>, win rate ${nf(b.entryInWindow.winRate, 1)} %. Es la cifra honesta.` }));
  }

  p.appendChild(el('h3', { text: 'Panel por libro', style: 'margin:22px 0 8px' }));
  p.appendChild(bookTable(b.full.books));
  return p;
}

    const p = el('div', { class: 'panel' });
    p.appendChild(el('h2', { text: `Torneo: ${name}` }));
    p.appendChild(el('div', { class: 'sub', text: `${list[0].months} meses · ${list[0].folds} folds · ${list[0].perms} permutaciones del orden de símbolos · semilla ${list[0].seed}` }));
    for (const t of list) {
      p.appendChild(el('h3', { text: `Muestra ${t.quote}${t.longOnly ? ' · long-only' : ''}`, style: 'margin:16px 0 6px' }));
      const host = el('div', { class: 'chart' });
      p.appendChild(host);
      registerChart(() => forestPlot(host, t.rows.map(r => ({ name: r.name, delta: r.meanDelta, ci: r.ci, p: r.p }))));
      p.appendChild(el('figcaption', { text: 'Punto = mejora media pareada en Calmar. Barra = intervalo de confianza al 95 %. Si el intervalo cruza el «sin efecto», la muestra no puede distinguir la variante del baseline. Verde = P(mejora) ≥ 0,80.' }));
      const d = el('details', { class: 'tbl' }, [el('summary', { text: 'Ver la tabla completa' })]);
      d.appendChild(table(
        [{ t: 'Variante' }, { t: 'Calmar med.', r: 1 }, { t: 'IQR', r: 1 }, { t: 'Peor fold', r: 1 }, { t: 'Δ media', r: 1 }, { t: 'IC 95 %', r: 1 }, { t: 'P(Δ>0)', r: 1 }, { t: 'Ruido orden', r: 1 }, { t: 'Veredicto' }],
        t.rows.map(r => [
          r.name, nf(r.medianCalmar, 2), nf(r.iqrCalmar, 2), nf(r.worstCalmar, 2),
          { t: r.meanDelta == null ? '—' : usd(r.meanDelta), cls: sign(r.meanDelta) },
          r.ci?.[0] == null ? '—' : `[${nf(r.ci[0], 2)}, ${nf(r.ci[1], 2)}]`,
          { t: r.p == null ? '—' : nf(r.p, 3), cls: r.p != null && r.p >= 0.8 ? 'pos' : '' },
          nf(r.spreadByOrder, 2),
          { html: `<span class="mono" style="font-size:.72rem">${r.verdict || ''}</span>` },
        ])
      ));
      p.appendChild(d);
    }
    v.appendChild(p);
  }

  // Walk-forward por folds — la otra mitad de la validación.
  const wfs = [
    ['SMA150-LS · cartera', AN?.walkforward],
    ['ROT-dual-mom', AN?.rotation?.walkforward],
  ].filter(([, w]) => w?.rows?.length);
  for (const [name, w] of wfs) {
    const p = el('div', { class: 'panel' });
    p.appendChild(el('h2', { text: `Walk-forward · ${name}` }));
    p.appendChild(el('div', { class: 'sub', text: `${w.months} meses · ${w.folds} folds · ventana anclada expansiva` }));
    const host = el('div', { class: 'chart' });
    p.appendChild(host);
    const rows = w.rows.filter(r => !r.skipped);
    registerChart(() => divergingBars(host, rows.map(r => ({ label: `${r.from} → ${r.to}`, value: r.roi })), { labelW: 170, fmt: (v) => `${nf(v, 1)} %` }));
    p.appendChild(el('figcaption', { text: 'ROI por fold fuera de muestra. Los folds sin operaciones cuentan como 0 % — irse a cash es un resultado, no un dato ausente.' }));
    const d = el('details', { class: 'tbl' }, [el('summary', { text: 'Ver métricas por fold' })]);
    d.appendChild(table(
      [{ t: 'Desde' }, { t: 'Hasta' }, { t: 'Ops', r: 1 }, { t: 'ROI', r: 1 }, { t: 'PF', r: 1 }, { t: 'Sharpe', r: 1 }, { t: 'Calmar', r: 1 }, { t: 'MaxDD', r: 1 }, { t: 'HODL', r: 1 }],
      rows.map(r => [r.from, r.to, r.trades,
        { t: pct(r.roi, 1), cls: sign(r.roi) }, nf(r.pf, 2), nf(r.sharpe, 2), nf(r.calmar, 2),
        `${nf(r.maxDD, 1)} %`, { t: pct(r.hodlRoi, 1), cls: sign(r.hodlRoi) }])
    ));
    p.appendChild(d);
    v.appendChild(p);
  }
  return v;
}

function viewRotation() {
  const v = el('div');
  const b = AN?.rotation?.backtest;
  if (!b) { v.appendChild(el('div', { class: 'empty', text: 'Sin backtest de rotación.' })); return v; }
  v.appendChild(el('div', { class: 'note warn', html: '<b>Canal experimental.</b> Aportó el 88 % del beneficio reportado antes del reset y no tenía backtest hasta el 2026-08-29. Su universo de backtest es FIJO: no reconstruye el top-N por volumen point-in-time que usa el canal en vivo, así que valida las REGLAS, no la selección de universo.' }));
  const p = el('div', { class: 'panel' });
  p.appendChild(el('h2', { text: 'ROT-dual-mom · primer backtest' }));
  p.appendChild(el('div', { class: 'sub', text: `${b.months} meses · ${b.symbols.length} símbolos · costes ${nf(b.costs?.roundTripPct, 2)} % round-trip` }));
  p.appendChild(el('div', { class: 'tiles', style: 'margin-bottom:16px' }, [
    tile('ROI completo', pct(b.full.roi), null, sign(b.full.roi)),
    tile('ROI holdout', pct(b.holdout?.roi), 'fuera de muestra', sign(b.holdout?.roi)),
    tile('PF holdout', nf(b.holdout?.profitFactor, 2), null, (b.holdout?.profitFactor ?? 0) >= 1 ? 'pos' : 'neg'),
    tile('BTC HODL', pct(b.benchmark?.btc?.roi), 'mismo periodo', sign(b.benchmark?.btc?.roi)),
  ]));
  p.appendChild(el('div', { class: 'note', html: `El holdout da <b>PF ${nf(b.holdout?.profitFactor, 2)}</b> y <b>ROI ${pct(b.holdout?.roi)}</b> mientras BTC hacía <b>${pct(b.benchmark?.btc?.roi)}</b>. Es la razón por la que el canal está etiquetado como experimental y excluido del titular consolidado.` }));
  p.appendChild(bookTable(b.full.books));
  v.appendChild(p);
  return v;
}

/* ─────────────────────────────── Arranque ─────────────────────────────── */

const VIEWS = [
  { id: 'live', label: 'En vivo', render: viewLive },
  { id: 'backtest', label: 'Señales · histórico', render: viewBacktest },
  { id: 'validation', label: 'Validación', render: viewValidation },
  { id: 'rotation', label: 'Rotación', render: viewRotation },
];
let current = location.hash.slice(1) || 'live';

function paint() {
  charts.length = 0;
  const views = $('#views'); views.innerHTML = '';
  const tabs = $('#tabs'); tabs.innerHTML = '';
  for (const v of VIEWS) {
    const b = el('button', { role: 'tab', 'aria-selected': String(v.id === current), text: v.label });
    b.addEventListener('click', () => { current = v.id; location.hash = v.id; paint(); window.scrollTo({ top: 0, behavior: 'instant' }); });
    tabs.appendChild(b);
  }
  views.appendChild(VIEWS.find(v => v.id === current)?.render() || el('div'));
  // Ya en el DOM: ahora los gráficos pueden medirse de verdad.
  requestAnimationFrame(drawCharts);
  $('#foot').innerHTML = `Datos en vivo leídos de Netlify Blobs${LIVE ? ` · ${fechaHora(LIVE.generatedAt)}` : ' · no disponibles'}` +
    `${AN ? ` · análisis generado ${fechaHora(AN.generatedAt)}` : ''}. Dinero VIRTUAL (shadow mode).`;
}

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawCharts, 160); });

$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? null : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  if (next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
  try { next ? localStorage.setItem('theme', next) : localStorage.removeItem('theme'); } catch {}
  drawCharts();   // los colores salen de las custom properties: hay que repintar
});
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch {}

async function load() {
  $('#status').innerHTML = '<div class="empty">Cargando…</div>';
  const [live, an] = await Promise.allSettled([
    fetch('/api/dashboard-data', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status))),
    fetch('data/analysis.json').then(r => r.ok ? r.json() : Promise.reject(new Error(r.status))),
  ]);
  LIVE = live.status === 'fulfilled' ? live.value : null;
  AN = an.status === 'fulfilled' ? an.value : null;
  $('#status').innerHTML = '';
  paint();
}
$('#reload').addEventListener('click', load);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current) { current = h; paint(); } });
load();
</script>
